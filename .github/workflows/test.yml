name: Lina AI Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Test Lina
        run: |
          python -m py_compile ai/brain.py
          python -m py_compile app.py
          python -c "from ai.brain import LinaBrain; print(LinaBrain().create_prompt('Merhaba Lina'))"
